name: Aktualizacja danych AED i publikacja

on:
  schedule:
    - cron: "30 3 * * *"   # codziennie 03:30 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja
        run: pip install -e ".[dev]"

      - name: Testy
        run: pytest -q

      - id: pages
        uses: actions/configure-pages@v5

      - name: Pobranie źródeł, łączenie i eksport
        run: aed run
        env:
          WAW_API_TOKEN: ${{ secrets.WAW_API_TOKEN }}
          AED_PUBLISH_BASE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
